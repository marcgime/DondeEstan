name: launch-app
version: 2.0.0
description: >-
  Arranca la aplicación (stack Flutter) en el dispositivo o plataforma indicada.
cli_dependencies:
  - flutter
inputs:
  device:
    type: string
    description: ID de dispositivo Flutter (windows, macos, linux, android, emulador o ID de flutter devices).
    required: false
  list:
    type: boolean
    description: Lista los dispositivos disponibles y termina.
    required: false
outputs:
  exit_code:
    type: integer
    description: 0 si la app arranca correctamente.
command: python .ai-harness/skills/launch-app/runner.py
