name: AI Harness Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-harness:
    name: Deterministic Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Harness dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Run Harness Architecture Validator
        run: |
          python .ai-harness/skills/harness-validator/runner.py

      - name: 2. Run Preflight Integrity & Architecture Checks
        run: |
          python .ai-harness/skills/preflight/runner.py --strict

      - name: 3. Run OpenSpec SDD Sync Audit
        run: |
          python .ai-harness/skills/sync-sdd/runner.py

      - name: 4. Check Tamper Resistance (Arnés Inmutable en PRs de producto)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_PROTECTED=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep -E '^(\.ai-harness/skills/|\.ai-harness/context/|\.github/|harness\.config\.yaml)' || true)
          if [ -n "$CHANGED_PROTECTED" ]; then
            echo "::warning::Se han detectado cambios en archivos protegidos del arnés:"
            echo "$CHANGED_PROTECTED"
            # Si se desea bloqueo estricto en PRs automatizadas de IA:
            # exit 1
          fi

